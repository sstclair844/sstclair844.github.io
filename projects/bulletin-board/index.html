<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bulletin Board (Exercise)</title>
        <link href="css/setup.css" rel="stylesheet">
        <link href="css/style.css" rel="stylesheet" data-meal-prep>
    </head>
    <body>
        <div id="bulletin-board">
            <!-- ADD YOUR HTML CODE INSIDE OF THIS DIV -->
            <div class="post-it pink">
                <div class="push-pin red"></div>    
                <h2>Evil List</h2>
                <ul>
                    <li>Large Hose</li>
                    <li>bubble Wrap</li>
                    <li>Killer Whale</li>
                    <li>Explosives</li>
                </ul>
            </div>
            <div class="post-it blue">
                <div class="push-pin dblue"></div> 
                <h1>You Got This!</h1>
            </div>
            <div class="post-it green">
                <div class="push-pin dgreen"></div> 
                <h2>note to self</h2>
                <p>call about the racoon army in the garage!</p>
            </div>
            <br>
            <div class="post-it yellow">
                <div class="push-pin dgreen"></div> 
                <h4>spagetti dinner fundraiser</h4>
                <h5>September 24th @ 5!</h5>
            </div>
            <div class="post-it white">
                <div class="push-pin red"></div> 
                <img
                    src="images/bubblegum.jpg"
                    alt="growling dog"
                >
            </div>
            <div class="post-it blue">
                <div class="push-pin dblue"></div> 
                <h2>Tennis with Steve saturday</h2>
            </div>
        </div>
    </body>
</html>
