<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>floating color palettes</title>
        <link href="css/style.css" rel="stylesheet">
    </head>
    <body>
        <div class="color-palette">
            <h2>Smoke</h2>
            <h4 class="color" id="color-1">#323031</h4>
            <h4 class="color" id="color-2">#3D3B3C</h4>
            <h4 class="color" id="color-3">#7F7979</h4>
            <h4 class="color" id="color-4">#C1BDB3</h4>
        </div>
        <div class="color-palette">
            <h2>Grape Juice</h2>
            <h4 class="color" id="color-5">#E4B7E5</h4>
            <h4 class="color" id="color-6">#B288C0</h4>
            <h4 class="color" id="color-7">#7E5A9B</h4>
            <h4 class="color" id="color-8">#63458A</h4>
        </div>
        <div class="color-palette">
            <h2>Lemon Lime</h2>
            <h4 class="color" id="color-9">#628B48</h4>
            <h4 class="color" id="color-10">#6AB547</h4>
            <h4 class="color" id="color-11">#EDD83D</h4>
            <h4 class="color" id="color-12">#F3F9E3</h4>
        </div>
    </body>
</html>
